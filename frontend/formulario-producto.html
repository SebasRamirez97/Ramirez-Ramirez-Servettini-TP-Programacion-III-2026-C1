<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenkiu - Gestionar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-dark text-white p-3 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <img src="../resources/logo.png" alt="Logo" style="width: 40px; height: 40px;">
                <h1 class="h4 m-0">Tenkiu - Formulario</h1>
            </div>
            <nav class="d-flex gap-3">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
                <a href="ventas.html" class="btn btn-outline-light btn-sm">Ver Ventas</a>
            </nav>
        </div>
    </header>

    <main class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h2 class="h3 mb-4 text-center">Formulario de Producto</h2>
            
            <form action="#" method="POST" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label for="nombre" class="form-label font-weight-bold">Nombre del Producto</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej: Slug Flyer" required>
                </div>

                <div class="mb-3">
                    <label for="categoria" class="form-label">Tipo / Categoría</label>
                    <select class="form-select" id="categoria" required>
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="vehiculos">Vehículos</option>
                        <option value="powerups">Power-ups</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Precio ($)</label>
                    <input type="number" class="form-control" id="precio" placeholder="Ej: 125000" required>
                </div>

                <div class="mb-4">
                    <label for="imagen" class="form-label">Imagen del Producto</label>
                    <input type="file" class="form-control" id="imagen" accept="image/*">
                    <div class="form-text">Formatos permitidos: png, jpg, jpeg. Máx 2MB.</div>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a href="dashboard.html" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Producto</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-dark text-white-50 text-center py-3 mt-auto">
        <div class="container">
            <p class="m-0 small">UTN Avellaneda - Programación III</p>
            <p class="m-0 small"><strong>Alumnos:</strong> Ramirez - Ramirez - Servettini</p>
        </div>
    </footer>
</body>
</html>
