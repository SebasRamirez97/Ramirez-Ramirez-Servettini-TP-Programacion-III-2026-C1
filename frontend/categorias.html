<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tenkiu - Autoservicio</title>
        
        <link rel="icon" href="../resources/logo.png" type="image/png" />

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head> 
    <body>
        <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.body.classList.add('dark-mode');
        }
        </script>

        <header>
            <div class="d-flex align-items-center gap-3">
                <img src="../resources/logo.png" alt="Logo Tenkiu" style="width: 45px; height: 45px; object-fit: contain;">
            <div>
                <h1 class="m-0 fuente-marca gap-2">Tenkiu</h1>
            </div>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <button id="btn-tema" type="button" class="btn btn-dark" style="font-size: 1.2rem; padding: 6px 12px;">
                    🌙
                </button>
            </div>   
        </header>


        <main class="container-fluid px-3">
            <section id="pantalla-categorias" class="d-flex flex-column align-items-center justify-content-center gap-4" style="min-height: 80vh;">
                
                <div class="d-flex flex-column flex-md-row gap-3 gap-md-5 w-100 justify-content-center align-items-center px-2">
                    
                    <button id="btn-cat-powerups" type="button" class="btn btn-warning w-100" style="max-width: 300px; height: 150px;">
                        <span class="fuente-marca d-block text-truncate" style="font-size: calc(1.8rem + 1vw);">Power Ups</span>
                    </button>
                    
                    <button id="btn-cat-vehiculos" type="button" class="btn btn-primary w-100" style="max-width: 300px; height: 150px;">
                        <span class="fuente-marca d-block text-truncate" style="font-size: calc(1.8rem + 1vw);">Vehículos</span>
                    </button>
                    
                </div>
                
                <button id="btn-volver-inicio" type="button" class="btn btn-danger mt-4 px-4 py-2">Volver al Inicio</button>
            </section>
        </main>

        <footer>
            <h3>Todos los derechos reservados</h3>
            <small class="text-secondary d-none d-sm-inline">UTN Avellaneda - Programación III</small>
            <div class="d-flex align-items-center gap-4">
                <span class="text-white-50 small d-none d-md-inline">
                    <strong>Alumnos:</strong> Ramirez - Ramirez - Servettini
                </span>
            </div>
        </footer>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </body>
</html>
