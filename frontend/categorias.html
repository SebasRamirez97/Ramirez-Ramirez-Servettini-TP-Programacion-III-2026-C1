<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.body.classList.add('dark-mode');
        }
        </script>

        <header>
            <div class="d-flex align-items-center gap-3">
                <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;">
                TK
            </div>
            <div>
                <h1 class="m-0 h4">Tenkiu</h1>
            </div>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <button id="btn-carrito" type="button" class="btn btn-danger d-none">
                    Carrito
                </button>
                <button id="btn-tema" type="button" class="btn btn-dark">
                    Modo Oscuro
                </button>
            </div>   
        </header>


        <main>
           <section id="pantalla-categorias" class="d-flex flex-column align-items-center justify-content-center gap-4" style="min-height: 80vh;">
                <div class="d-flex gap-5">
                    <button id="btn-cat-powerups" type="button" class="btn btn-warning" style="width: 250px; height: 150px; font-size: 2rem;">Power Ups</button>
                    <button id="btn-cat-vehiculos" type="button" class="btn btn-primary" style="width: 250px; height: 150px; font-size: 2rem;">Vehículos</button>
                </div>
                <button id="btn-volver-inicio" type="button" class="btn btn-secondary mt-5">Volver al Inicio</button>
            </section>
        </main>

        <footer>
            <h3>Todos los derechos reservados</h3>
            <small class="text-secondary d-none d-sm-inline">UTN Avellaneda - Programación III</small>
            <div class="d-flex align-items-center gap-4">
                <span class="text-white-50 small d-none d-md-inline">
                    <strong>Alumnos:</strong> Ramirez - Ramirez - Servettini
                </span>
            </div>
        </footer>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </body>
</html>
