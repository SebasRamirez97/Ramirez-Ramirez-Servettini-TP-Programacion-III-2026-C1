
<!DOCTYPE html>
<html lang="es">
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Tenkiu - Autoservicio</title>
            
            <link rel="icon" href="../resources/logo.png" type="image/png" />

            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
            <link rel="stylesheet" href="style.css">
        </head>
    <body>
        <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.body.classList.add('dark-mode');
        }
        </script>
        
        <header>
            <div class="d-flex align-items-center gap-3">
                <img src="../resources/logo.png" alt="Logo Tenkiu" style="width: 45px; height: 45px; object-fit: contain;">
            <div>
                <h1 class="m-0 fuente-marca gap-2">Tenkiu</h1>
            </div>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <button id="btn-tema" type="button" class="btn btn-dark" style="font-size: 1.2rem; padding: 6px 12px;">
                    🌙
                </button>
            </div>   
        </header>


        <main class="container-fluid fondo-pantalla d-flex justify-content-center align-items-center m-0 p-0">
           <section id="pantalla-bienvenida" class="d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
                <h1 class="m-0 h1 fuente-marca gap-2" style=" height: 190;  font-size: 8rem; ">Bienvenido</h1>
                <input type="text" id="input-nombre" class="form-control w-50 mb-3" placeholder="Ingrese su nombre">
                <button id="btn-comprar" type="button" class="btn btn-danger btn-lg">ir a comprar</button>
           </section>
        </main>
        
        <footer>
            <h3>Todos los derechos reservados</h3>
            <small class="text-secondary d-none d-sm-inline">UTN Avellaneda - Programación III</small>
            <div class="d-flex align-items-center gap-4">
<!--Acceso al login admin   <a href="http://localhost:3000/api/administradores/login" class="btn btn-link btn-sm text-secondary">Login Admin</a> -->  
                <span class="text-white-50 small d-none d-md-inline">
                    <strong>Alumnos:</strong> Ramirez - Ramirez - Servettini
                </span>
            </div>
        </footer>

        <div class="modal fade" id="modalNombre" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Atención</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        Por favor ingresá tu nombre para continuar.
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </body>
</html>
