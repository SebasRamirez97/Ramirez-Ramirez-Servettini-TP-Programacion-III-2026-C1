
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Tenkiu</h1>
            <div class="d-flex gap-2 align-items-center">
                <!-- Botón Carrito: Rojo (btn-danger) y oculto por defecto -->
                <button id="btn-carrito" type="button" class="btn btn-danger d-none">
                    Carrito
                </button>
                <!-- Botón Cla/Osc: Se inicia como btn-dark por defecto -->
                <button id="btn-tema" type="button" class="btn btn-dark">
                    Modo Oscuro
                </button>
            </div>
        </header>


        <main>
           <section id="pantalla-bienvenida" class="d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
                <h1>Bienvenido</h1>
                <input type="text" id="input-nombre" class="form-control w-25 mb-3" placeholder="Ingrese su nombre">
                <button id="btn-comprar" type="button" class="btn btn-danger btn-lg">Ir a comprar</button>
           </section>
        </main>
        <footer>
            <h3>Todos los derechos reservados</h3>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </body>
</html>
