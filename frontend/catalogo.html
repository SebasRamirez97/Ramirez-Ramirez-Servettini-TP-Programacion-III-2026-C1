<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Tenkiu</h1>
            <div class="d-flex gap-2 align-items-center">
                <!-- Botón Carrito: Rojo (btn-danger) y oculto por defecto -->
                <button id="btn-carrito" type="button" class="btn btn-danger">
                    Carrito
                </button>
       
                <button id="btn-tema" type="button" class="btn btn-dark">
                    Modo Oscuro
                </button>
            </div>
        </header>


        <main>
            <section id="pantalla-catalogo" class="d-flex flex-row w-100 align-items-stretch">
                <aside class="bg-dark p-4 d-flex flex-column gap-3 flex-shrink-0" style="width: 250px;">
                    <button class="btn btn-outline-warning w-100 text-start nav-categoria" data-categoria="powerups">Power Ups</button>
                    <button class="btn btn-outline-primary w-100 text-start nav-categoria" data-categoria="vehiculos">Vehículos</button>
                    
                    <div> <button id="btn-volver-categorias" class="btn btn-outline-light w-100 text-start">Volver</button>
                    </div>
                </aside>

                <div class="flex-grow-1 p-5">
                    <h2 id="titulo-catalogo" class="mb-4">Productos</h2>
                    <div id="contenedor-productos" class="productos-grid"></div>
                </div>
            </section>

        </main>

        <footer>
            <h3>Todos los derechos reservados</h3>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </body>
</html>
