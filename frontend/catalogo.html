<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tenkiu - Autoservicio</title>
        
        <link rel="icon" href="../resources/logo.png" type="image/png" />

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.body.classList.add('dark-mode');
        }
        </script>
        
        <header>
            <div class="d-flex align-items-center gap-3">
                <img src="../resources/logo.png" alt="Logo Tenkiu" style="width: 45px; height: 45px; object-fit: contain;">
            <div>
                <h1 class="m-0 fuente-marca gap-2">Tenkiu</h1>
            </div>
            </div>
                <div >
                    <button id="btn-carrito" type="button" class="btn btn-danger d-none" style="font-size: 1.2rem; padding: 6px 12px;">
                    🛒
                    </button>
                    <button id="btn-tema" type="button" class="btn btn-dark" style="font-size: 1.2rem; padding: 6px 12px;">
                        🌙
                    </button>
                </div>
            </div>    
        </header>


        <main>
            <section id="pantalla-catalogo" class="d-flex flex-row w-100 align-items-stretch">
                <aside class="bg-dark p-4 d-flex flex-column gap-3 flex-shrink-0" style="width: 250px;">
                    <button class="btn btn-warning w-100 text-start nav-categoria" data-categoria="powerups">Power Ups</button>
                    <button class="btn btn-primary w-100 text-start nav-categoria" data-categoria="vehiculos">Vehículos</button>
                    
                    <div> <button id="btn-volver-categorias" class="btn btn-outline-light w-100 text-start">Volver</button>
                    </div>
                </aside>

                <div class="flex-grow-1 p-5">
                    <h2 id="titulo-catalogo" class="mb-4">Productos</h2>
                    <div id="contenedor-productos" class="productos-grid"></div>
                </div>
            </section>

        </main>

        <footer>
            <h3>Todos los derechos reservados</h3>
            <small class="text-secondary d-none d-sm-inline">UTN Avellaneda - Programación III</small>
            <div class="d-flex align-items-center gap-4">
                <span class="text-white-50 small d-none d-md-inline">
                    <strong>Alumnos:</strong> Ramirez - Ramirez - Servettini
                </span>
            </div>
        </footer>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </body>
</html>
